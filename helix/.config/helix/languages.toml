# [language.formatter]
# command = "prettier"
# args = ["--stdin-filepath", "dummy.php"]
[language.formatter]
command = "npx"
args = ["prettier", "--stdin-filepath", "dummy.php"]

# --- Définition du serveur de langage (pour l'autocomplétion, etc.) ---
[language-server.intelephense]
command = "intelephense"
args = ["--stdio"]



