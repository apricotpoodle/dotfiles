# --- Configuration pour JavaScript & TypeScript ---

[[language]]
name = "javascript"
language-servers = [ "typescript-language-server" ]
# formatter = { command = "prettier", args = ["--stdin-filepath", "%_"] }
auto-format = true

[language.formatter]
command = "npx"
args = ["prettier", "--stdin-filepath", "dummy.php"]

[[language]]
name = "jsx"
language-servers = [ "typescript-language-server" ]
formatter = { command = "prettier", args = ["--stdin-filepath", "%_"] }
auto-format = true

[[language]]
name = "typescript"
language-servers = [ "typescript-language-server" ]
formatter = { command = "prettier", args = ["--stdin-filepath", "%_"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = [ "typescript-language-server" ]
formatter = { command = "prettier", args = ["--stdin-filepath", "%_"] }
auto-format = true

[[language]]
name = "php"
scope = "source.php"
injection-regex = "php"
file-types = ["php", "inc", "php4", "php5", "phtml", "ctp"]
shebangs = ["php"]
roots = ["composer.json", "index.php"]
comment-token = "//"
# language-servers = [ "phpactor" ]
# language-servers = ["intelephense", "phpactor" ]
language-servers = ["intelephense" ]
indent = { tab-width = 4, unit = "    " }
auto-format = true

[[grammar]]
name = "php"
source = { git = "https://github.com/tree-sitter/tree-sitter-php", rev = "f860e598194f4a71747f91789bf536b393ad4a56" }


